plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose'; id 'io.github.takahirom.roborazzi' }
def ksFile = rootProject.file('release/keys/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
android {
  namespace 'ru.pirogovlab.tatarkamera'
  compileSdk 36
  defaultConfig { applicationId 'ru.pirogovlab.tatarkamera'; minSdk 24; targetSdk 36; versionCode 1; versionName '0.1.0'; ndk { abiFilters 'arm64-v8a' } }
  signingConfigs { release { if (ks['storeFile']) { storeFile rootProject.file('release/keys/' + ks['storeFile']); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword'] } } }
  buildTypes { release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.release }
    debug { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
  packaging { jniLibs { useLegacyPackaging false } }
  buildFeatures { compose true; buildConfig true }
  testOptions { unitTests { includeAndroidResources = true; all { it.maxHeapSize = '3g'; it.systemProperty 'robolectric.graphicsMode', 'NATIVE'; it.systemProperty 'robolectric.pixelCopyRenderMode','hardware'; if (project.hasProperty('cfg')) it.systemProperty 'cfg', project.property('cfg') } } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  // tflite сжимаются: распаковываются в filesDir (ModelFiles)
}
dependencies {
  def cam = '1.4.2'
  implementation 'com.yandex.android:mobileads:8.6.0'
  implementation platform('androidx.compose:compose-bom:2024.12.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
  implementation "androidx.camera:camera-camera2:$cam"
  implementation "androidx.camera:camera-lifecycle:$cam"
  implementation "androidx.camera:camera-view:$cam"
  implementation 'com.google.mlkit:image-labeling:17.0.9'
  implementation 'com.google.mlkit:object-detection:17.0.2'
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.ai.edge.litert:litert:1.4.0'
}
dependencies {
  testImplementation platform('androidx.compose:compose-bom:2024.12.01')
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
  testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.43.0'
  testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.43.0'
  testImplementation 'androidx.compose.ui:ui-test-junit4'
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
